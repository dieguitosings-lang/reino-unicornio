<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b3fd0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reino Unicornio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#f6efff;--bg2:#ffeef8;--ink:#2d1b4e;--muted:#6f5a92;--card:#ffffff;--line:#eadcff;
  --pur:#7b3fd0;--pur2:#a970ff;--pink:#ff6fb5;--mint:#2bb5a3;--star:#ffb520;--bad:#e5484d;--good:#1e9e6a;
  --plus:#16a36b;--minus:#e0447f;
  --r:22px;--shadow:0 6px 0 rgba(123,63,208,.12),0 10px 24px rgba(123,63,208,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#eafaf7);min-height:100vh;font-size:20px;line-height:1.3;
  padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#7b3fd0,#b25cf0 60%,#ff6fb5);color:#fff;
  padding:calc(8px + env(safe-area-inset-top)) 0 10px;box-shadow:0 4px 14px rgba(123,63,208,.25)}
.top .wrap{display:flex;align-items:center;gap:10px}
.lvl{flex:1;min-width:0}
.lvl b{font-size:18px;letter-spacing:.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffe36e,#ffb520);border-radius:9px;transition:width .5s}
.starbox{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);border-radius:16px;padding:4px 10px;font-weight:800;font-size:20px}
.papas{font-size:14px;font-weight:700;background:rgba(255,255,255,.18);border-radius:14px;padding:6px 10px;color:#fff}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:2px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 4px;border-radius:16px;font-weight:700;font-size:15px;color:var(--muted)}
nav.tabs button .ic{font-size:28px;line-height:1.1}
nav.tabs button.on{background:#f1e6ff;color:var(--pur)}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:14px 0}
h1{font-size:34px;line-height:1.1;margin:16px 0 4px}
h2{font-size:24px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pur);color:#fff;font-weight:800;
  border-radius:18px;padding:12px 22px;font-size:22px;box-shadow:0 5px 0 #5a2aa3;min-height:56px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5a2aa3}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 #c94489}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #1d8577}
.btn.gold{background:#ffb520;color:#4a2c00;box-shadow:0 5px 0 #c98400}
.btn.ghost{background:#fff;color:var(--pur);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.small{font-size:17px;padding:8px 14px;min-height:44px}
/* missions */
.mission{display:flex;gap:14px;align-items:center;border-radius:var(--r);padding:16px;margin:12px 0;color:#fff;box-shadow:var(--shadow);text-align:left;width:100%}
.mission .em{font-size:46px;width:70px;height:70px;border-radius:20px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.mission b{font-size:24px;display:block}
.mission span{font-size:16px;opacity:.95}
.mission.done{filter:saturate(.55);opacity:.8}
.mission .ok{margin-left:auto;font-size:34px}
.m1{background:linear-gradient(120deg,#ff6fb5,#ff9ccf)}
.m2{background:linear-gradient(120deg,#7b3fd0,#a970ff)}
.m3{background:linear-gradient(120deg,#22a596,#5fd6c4)}
.mev{background:linear-gradient(120deg,#ff9f1c,#ffc857)}
.mx{background:linear-gradient(120deg,#5b7cfa,#b06bff 55%,#ff6fb5)}
.chest{display:flex;gap:14px;align-items:center;background:#fff7d6;border:3px dashed #ffc233;border-radius:var(--r);padding:14px;margin:12px 0}
.chest .em{font-size:52px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.dots i{width:14px;height:14px;border-radius:50%;background:#e8ddff;display:block}
.dots i.ok{background:var(--good)}.dots i.no{background:#ffb3b6}.dots i.now{background:var(--pur2);box-shadow:0 0 0 3px #e3d0ff}
.event{display:flex;gap:12px;align-items:center}
.cal{width:62px;flex:none;text-align:center;border-radius:14px;background:#fff3dc;color:#a35b00;font-weight:800;line-height:1;padding:8px 0}
.cal b{font-size:26px;display:block}
/* game */
.q{text-align:center}
.gtop{display:flex;align-items:center;gap:10px}
.mini{width:62px;flex:none}
.mini.hop{animation:hop .6s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
.qtitle{font-size:28px;font-weight:800;margin:6px 0 4px}
.bignum{font-size:96px;font-weight:800;line-height:1;margin:10px 0;color:var(--pur)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.one{grid-template-columns:1fr}
.opts.words .opt{font-size:24px}
.opt{background:#fff;border:3px solid var(--line);border-radius:20px;min-height:88px;font-size:42px;font-weight:800;color:var(--ink);box-shadow:0 5px 0 var(--line);padding:6px}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt.good{background:#dcf7ea;border-color:var(--good);color:var(--good)}
.opt.bad{background:#ffe5e6;border-color:var(--bad);color:var(--bad);animation:shake .35s}
.opt.show{outline:4px dashed var(--good)}
.opt.plus{color:var(--plus);border-color:#bfead6;font-size:56px;line-height:1}
.opt.minus{color:var(--minus);border-color:#f8c8da;font-size:56px;line-height:1}
.opt small{display:block;font-size:18px;font-weight:700}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.how{background:#fff7d6;border:2px solid #ffd970;border-radius:18px;padding:10px 14px;text-align:left;font-size:18px;display:flex;gap:10px;align-items:center}
.how .t{flex:1}
.speak{width:52px;height:52px;border-radius:16px;background:#f1e6ff;color:var(--pur);font-size:26px;flex:none;display:grid;place-items:center}
.hint{background:#eafaf7;border:2px dashed var(--mint);border-radius:18px;padding:12px;margin-top:14px;text-align:center}
.hint p{margin:4px 0 8px;font-size:20px}
.visual{margin:10px auto 0;max-width:100%;overflow-x:auto}
.visual svg{max-width:100%;height:auto}
.eq{display:flex;justify-content:center;align-items:center;gap:10px;font-size:64px;font-weight:800;color:var(--ink);flex-wrap:wrap;line-height:1}
.op{display:inline-grid;justify-items:center;line-height:.9;font-size:64px}
.op small{font-size:16px;font-weight:800;letter-spacing:.5px}
.op.plus{color:var(--plus)}.op.minus{color:var(--minus)}.op.eqs{color:var(--muted)}
.qbox{display:inline-grid;place-items:center;min-width:76px;height:76px;border:4px dashed var(--pink);border-radius:18px;color:var(--pink)}
.vert{display:inline-grid;grid-template-columns:repeat(3,64px);font-size:56px;font-weight:800;line-height:1.15;text-align:center;margin:6px auto}
.vert .h{font-size:18px;color:var(--muted)}
.vert .l{border-top:5px solid var(--ink);grid-column:1/4;height:4px}
.cmp{display:flex;justify-content:center;align-items:center;gap:16px;font-size:80px;font-weight:800;color:var(--pur)}
.cmp .box{width:96px;height:96px;border:4px dashed var(--pink);border-radius:20px}
.ans{display:inline-block;min-width:150px;min-height:84px;border:4px solid var(--pur2);border-radius:20px;font-size:60px;font-weight:800;line-height:76px;padding:0 14px;background:#fff;color:var(--pur)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:14px auto 0}
.pad button{min-height:70px;border-radius:18px;background:#f1e6ff;font-size:34px;font-weight:800;color:var(--ink);box-shadow:0 4px 0 #dcc8ff}
.pad button.okb{background:var(--pur);color:#fff;box-shadow:0 4px 0 #5a2aa3}
.slots{display:flex;justify-content:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.slots span{width:84px;height:84px;border-radius:18px;border:3px dashed var(--pur2);display:grid;place-items:center;font-size:40px;font-weight:800;color:var(--pur)}
.items{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.items button{width:96px;height:96px;border-radius:20px;background:#fff;border:3px solid var(--line);font-size:42px;font-weight:800;box-shadow:0 5px 0 var(--line)}
.items button.used{visibility:hidden}
.items button.bad{animation:shake .35s;border-color:var(--bad)}
.ordrow{display:flex;justify-content:center;gap:4px;flex-wrap:nowrap;margin:10px 0}
.ordrow button{font-size:40px;width:68px;height:76px;border-radius:16px;background:#fff;border:3px solid var(--line);flex:none}
.ordrow button.good,.chart button.good,.nline button.good{background:#dcf7ea;border-color:var(--good)}
.ordrow button.bad,.chart button.bad,.nline button.bad{background:#ffe5e6;border-color:var(--bad);animation:shake .35s}
.ordrow button.show,.chart button.show,.nline button.show{outline:4px dashed var(--good)}
.chart{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:12px auto 0;max-width:620px}
.chart button{aspect-ratio:1;border-radius:10px;background:#fff;border:2px solid var(--line);font-size:20px;font-weight:800;padding:0}
.chart button:nth-child(20n+11),.chart button:nth-child(20n+12),.chart button:nth-child(20n+13),.chart button:nth-child(20n+14),.chart button:nth-child(20n+15),.chart button:nth-child(20n+16),.chart button:nth-child(20n+17),.chart button:nth-child(20n+18),.chart button:nth-child(20n+19),.chart button:nth-child(20n+20){background:#f8f3ff}
.nline{position:relative;display:flex;justify-content:space-between;gap:2px;margin:52px 0 6px;padding-top:6px}
.nline:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:3px;background:var(--ink)}
.nline button{flex:1;min-width:0;height:56px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:22px;font-weight:800;padding:0;position:relative}
.nline button .u{position:absolute;top:-50px;left:50%;transform:translateX(-50%);font-size:34px}
.tenf{display:inline-grid;grid-template-columns:repeat(5,44px);gap:6px;padding:8px;border:3px solid var(--ink);border-radius:12px;background:#fff;margin:8px auto}
.tenf i{width:44px;height:44px;border-radius:50%;border:2px dashed #cdbdf0;display:block}
.tenf i.on{background:var(--pink);border:2px solid #c94489}
.emo-group{font-size:40px;letter-spacing:2px;line-height:1.2}
.emo-group .gone{opacity:.3;text-decoration:line-through}
.story{font-size:24px;font-weight:700;background:#fff5fb;border-radius:18px;padding:12px;margin-top:8px}
.picto{display:grid;gap:6px;justify-content:center;margin:8px auto;text-align:left}
.picto div{display:flex;gap:8px;align-items:center;font-size:34px;border-bottom:2px solid var(--line);padding-bottom:4px}
.pattern{font-size:46px;letter-spacing:4px;margin:10px 0}
/* arcade */
.arena{position:relative;height:380px;border-radius:20px;background:linear-gradient(180deg,#2b1a5e,#7b3fd0 70%,#ff8fc7);overflow:hidden;margin-top:12px}
.arena .fall{position:absolute;top:-90px;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7b0,#ffc233 60%,#f2a900);color:#4a2c00;font-size:34px;font-weight:800;box-shadow:0 0 18px #ffe36e;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(480px)}}
.arena .fall.bad{background:#ffb3b6;animation-play-state:paused}
.arena .fall.good{background:#7ee2b8;animation-play-state:paused}
.arena .bub{position:absolute;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#bfe9ff 40%,#8fd1ff 70%,#a970ff);font-size:30px;font-weight:800;color:#2d1b4e;border:2px solid rgba(255,255,255,.8);animation:float 3s ease-in-out infinite}
.arena .bub.pop{animation:pop .3s forwards}
.arena .bub.bad{animation:shake .35s}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.memo button{aspect-ratio:3/4;border-radius:16px;font-size:26px;font-weight:800;background:linear-gradient(135deg,#a970ff,#ff6fb5);color:transparent;box-shadow:0 4px 0 #c9a8ff;position:relative}
.memo button:before{content:"🦄";position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:#fff}
.memo button.up{background:#fff;color:var(--ink);border:3px solid var(--line)}
.memo button.up:before,.memo button.done:before{content:""}
.memo button.done{background:#dcf7ea;color:var(--good);border:3px solid var(--good)}
/* end + celebrate */
.celebrate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(45,27,78,.45);padding:16px}
.celebrate .card{max-width:520px;width:100%;text-align:center}
.spark{position:fixed;pointer-events:none;z-index:70;font-size:32px;animation:fly 1s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
.confetti{position:fixed;top:-20px;z-index:75;pointer-events:none;font-size:26px;animation:drop linear forwards}
@keyframes drop{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;z-index:80;font-weight:700;font-size:18px}
.sticker-new{font-size:96px;line-height:1;animation:hop .8s 2}
/* games grid */
.island h2{display:flex;gap:8px;align-items:center}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.game{background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px;text-align:left;box-shadow:0 4px 0 var(--line)}
.game b{display:block;font-size:20px}
.game span{font-size:15px;color:var(--muted)}
.game .st{font-size:14px;color:var(--star);font-weight:800}
.game.magic{background:linear-gradient(135deg,#fff,#fff0fa);border-color:#ffc6e4}
/* unicorn page */
.uni{display:grid;place-items:center}
.uni svg{width:min(360px,92%);height:auto}
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.subtabs button{border-radius:16px;padding:10px 6px;background:#fff;border:3px solid var(--line);font-weight:800;font-size:18px}
.subtabs button.on{border-color:var(--pur);background:#f1e6ff;color:var(--pur)}
.items-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{border:3px solid var(--line);border-radius:18px;padding:10px;background:#fff;text-align:left;font-size:17px}
.item.lock{opacity:.55;background:#f7f3ff}
.item.on{border-color:var(--pur);background:#f6efff}
.item b{display:block;font-size:19px}
.item .price{font-weight:800;color:#7a4b00}
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stk{border-radius:18px;background:#fff;border:3px solid var(--line);text-align:center;padding:8px 4px;font-size:14px;font-weight:700}
.stk .e{font-size:44px;line-height:1.1;display:block}
.stk.no{background:#f5f0ff;color:#b9a8d9}
.stk.no .e{filter:grayscale(1) opacity(.25)}
table.prog{width:100%;border-collapse:collapse;font-size:16px}
table.prog td,table.prog th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
input[type=text],input[type=date],select{font:inherit;font-size:18px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);width:100%;background:#fff;color:var(--ink)}
label.f{display:grid;gap:4px;font-size:16px;color:var(--muted)}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;background:#f1e6ff;color:var(--pur)}
@media (max-width:520px){
  .bignum{font-size:72px}.opt{min-height:76px;font-size:34px}.opts.words .opt{font-size:20px}
  .items button{width:72px;height:72px;font-size:32px}.slots span{width:60px;height:60px;font-size:28px}
  .ordrow button{width:30px;height:52px;font-size:22px;border-radius:10px}
  .vert{grid-template-columns:repeat(3,50px);font-size:44px}
  .games,.items-grid{grid-template-columns:1fr}
  .album{grid-template-columns:repeat(3,1fr)}
  .eq,.op{font-size:46px}.qbox{min-width:58px;height:58px}
  .chart button{font-size:14px;border-radius:7px}
  .nline button{font-size:15px;height:46px}
  .arena .fall,.arena .bub{width:70px;height:70px;font-size:26px}
  h1{font-size:28px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="lvl"><b id="hudLvl">POTRILLO</b><div class="bar"><i id="hudBar" style="width:0%"></i></div></div>
  <div class="starbox" title="Estrellas"><span>⭐</span><span id="hudStars">0</span></div>
  <div class="starbox" title="Gemas"><span>💎</span><span id="hudGems">0</span></div>
  <button class="papas" id="hudPapas" aria-label="Panel de papás">Papás</button>
</div></header>
<main class="wrap" id="main"></main>
<nav class="tabs" aria-label="Secciones">
  <button data-view="hoy"><span class="ic">🌈</span>Hoy</button>
  <button data-view="juegos"><span class="ic">🏰</span>Juegos</button>
  <button data-view="magia"><span class="ic">✨</span>Magia</button>
  <button data-view="unicornio"><span class="ic">🦄</span>Unicornio</button>
</nav>
<script>
"use strict";
/* ================= datos de clase (desde Teams, Matemática 2° EGB) ================= */
const DATA={
  lastUpdate:"2026-10-25",
  events:[
    {date:"2026-10-29",title:"Lección de Matemática",detail:"Números ascendentes y descendentes hasta el 90. Sumas y problemas de sumas.",skills:["serie","antesDespues","ordenar","recta","suma2d","problema","sumaOresta"]},
    {date:"2026-10-22",title:"Lección de Matemática",detail:"Números ascendentes y descendentes. Sumas con reagrupación. Problemas a resolver.",skills:["serie","ordenar","suma2d","problema"]},
    {date:"2026-10-08",title:"Lección de Matemática",detail:"Familias del 60, 70, 80 y 90. Series ascendentes y descendentes. Ordenar y comparar. Antes, entre y después. Descomposición. Base 10 y ábaco. Dictado de cantidades.",skills:["familia","serie","ordenar","comparar","antesDespues","descomponer","bloques","abaco","dictado"]}
  ],
  temas:[
    "Secuencias y patrones","La decena: decenas puras","Sumas hasta 10 y de tres sumandos","Términos de la suma y de la resta",
    "Restas hasta 10 y en la recta numérica","Sumas en la recta numérica","Familias de números (hasta el 90)",
    "Números en ábaco y en base 10","Comparar con > < =","Ordenar de mayor a menor y de menor a mayor",
    "Antes, entre y después","Números ordinales hasta el 10°","Sumas de dos cifras (con y sin reagrupación)","Problemas con sumas",
    "El reloj (digital y analógico)","Pictogramas y gráficos de barras"
  ]
};
const LEVELS=[[0,"Potrillo"],[40,"Unicornio Brillante"],[110,"Unicornio Arcoíris"],[300,"Unicornio Alado"],[480,"Unicornio Real"],[750,"Reina Unicornio"],[1100,"Unicornio de Cristal"],[1600,"Unicornio Estelar"],[2300,"Emperatriz del Arcoíris"]];
/* premios que se ganan con estrellas (nivel) */
const ITEMS=[

  const out=[];shuffle(c).forEach(v=>{if(v>=0&&v<=Math.min(99,Math.max(max,n+2))&&v!==n&&!out.includes(v))out.push(v)});
  if(n>=10&&t!==u&&u!==0){const r=u*10+t;if(r<=99&&!out.slice(0,k).includes(r)){out.unshift(r)}}

  while(res.length<k){const v=R(0,Math.min(99,Math.max(max,10)));if(v!==n&&!res.includes(v))res.push(v)}
  return res;
}

/* ================= motor de juego ================= */
function startGame(ids,n,missionId,label){
  const qs=[];let i=0;const list=shuffle(ids);
  while(qs.length<n){const id=list[i%list.length];i++;try{const q=G[id]();q.id=id;qs.push(q)}catch(e){console.error(e)}}
  GAME={qs,i:0,res:[],tries:0,missionId,label,earned:0,startStars:S.stars};VIEW="game";render();window.scrollTo(0,0);
}
function viewGame(){
  const g=GAME,q=g.qs[g.i];const type=q.type||"opts";
  let h=`<section class="card q"><div class="gtop"><button class="btn ghost small" id="quit">Salir</button><div class="mini" id="mini">${unicornSVG(S.look)}</div><div class="dots" style="flex:1">${g.qs.map((_,k)=>`<i class="${k<g.res.length?(g.res[k]?"ok":"no"):k===g.i?"now":""}"></i>`).join("")}</div></div>`;
  h+=`<div class="how" style="margin-top:12px"><span class="t">${HOW[type]}</span><button class="speak" id="say" aria-label="Escuchar">🔊</button></div>`;
  h+=`<div class="qtitle">${q.title}</div>${q.body||""}`;
  if(type==="opts"){const signs=q.cls==="signs";
    h+=`<div class="opts ${signs?"":q.cls||""}">${q.opts.map((o,k)=>signs?`<button class="opt ${o==="+"?"plus":"minus"}" data-k="${k}">${o}<small>${o==="+"?"más · junta":"menos · quita"}</small></button>`:`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`}
  else if(type==="input")h+=`<div style="margin-top:10px"><span class="ans" id="ansBox">&nbsp;</span></div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join("")}<button data-d="del" aria-label="Borrar">⌫</button><button data-d="0">0</button><button data-d="ok" class="okb">OK</button></div>`;
  else if(type==="order")h+=`<div class="slots" id="slots">${q.order.map(()=>"<span></span>").join("")}</div><div class="items">${q.items.map((v,k)=>`<button data-k="${k}">${v}</button>`).join("")}</div>`;
  else if(type==="ordinal")h+=`<div class="ordrow">${q.row.map((e,k)=>`<button data-k="${k}" aria-label="unicornio">${e}</button>`).join("")}</div>`;
  else if(type==="chart")h+=`<div class="chart">${Array.from({length:q.top+1},(_,v)=>`<button data-v="${v}">${v}</button>`).join("")}</div>`;
  else if(type==="line")h+=`<div class="nline">${Array.from({length:q.to-q.from+1},(_,i)=>{const v=q.from+i;return `<button data-v="${v}">${v===q.start?'<span class="u">🦄</span>':""}${v}</button>`}).join("")}</div>`;
  h+=`<div id="hintBox"></div></section>`;
  $("#main").innerHTML=h;
  $("#quit").onclick=()=>{GAME=null;setView("hoy")};
  $("#say").onclick=()=>say(q.say);
  const rp=document.querySelector("[data-repeat]");if(rp)rp.onclick=()=>say(q.say);

function isOn(it){const l=S.look;const v=l[it.type];if(["mane","body","scene","pet"].includes(it.type))return v===it.val;if(it.type==="horn")return v===it.val;return v===it.val||(it.val===true&&v===true)}
function toggleItem(it){const l=S.look,on=isOn(it),def=defaultLook();
  if(["mane","body","scene","pet","horn"].includes(it.type))l[it.type]=on?def[it.type]:it.val;else l[it.type]=on?false:it.val}
function viewUnicornio(){
  const L=levelOf(S.stars);
  let h=`<h1>🦄 ${S.uniName?esc(S.uniName):"Mi unicornio"}</h1><div class="card uni">${unicornSVG(S.look,340)}<b style="font-size:24px">${L.name}</b><span class="muted">⭐ ${S.stars}${L.next?` · faltan ${L.to-S.stars} para ${L.next}`:""} · 💎 ${S.gems}</span></div>`;
  h+=`<div class="subtabs"><button data-t="vestir" class="${UTAB==="vestir"?"on":""}">👗 Vestir</button><button data-t="tienda" class="${UTAB==="tienda"?"on":""}">🛍️ Tienda</button><button data-t="album" class="${UTAB==="album"?"on":""}">📒 Álbum</button></div>`;
  if(UTAB==="vestir"){
    const mine=[...ITEMS.filter(it=>S.stars>=it.at),...SHOP.filter(it=>S.owned[it.id])];
    h+=`<div class="card"><h2>👗 Lo que tienes</h2><p class="small muted" style="margin-top:0">Toca para ponérselo o quitárselo.</p><div class="items-grid">`+(mine.length?mine.map(it=>`<button class="item ${isOn(it)?"on":""}" data-it="${it.id}"><b>${it.em} ${it.name}</b>${isOn(it)?"Puesto ✅":"Toca para ponérselo"}</button>`).join(""):`<p class="muted">Gana estrellas y gemas para tener cosas nuevas.</p>`)+`</div></div>`;
    h+=`<div class="card"><h2>🏅 Premios de nivel</h2><div class="items-grid">`+ITEMS.filter(it=>S.stars<it.at).map(it=>`<div class="item lock"><b>${it.em} ${it.name}</b>🔒 Se gana con ⭐ ${it.at}</div>`).join("")+`</div></div>`;
    h+=`<div class="card"><h2>✏️ Nombre de tu unicornio</h2><div class="row"><input type="text" id="uniName" maxlength="16" value="${esc(S.uniName)}" placeholder="Escribe un nombre" style="flex:1;min-width:180px"><button class="btn small" id="uniSave">Guardar</button></div></div>`;
  }else if(UTAB==="tienda"){
    h+=`<div class="card"><div class="row spread"><h2>🛍️ Tienda mágica</h2><span class="tag" style="font-size:18px">💎 ${S.gems}</span></div><div class="items-grid">`+SHOP.map(it=>{const own=!!S.owned[it.id],can=S.gems>=it.price;
      return `<div class="item ${own?"on":""}"><b>${it.em} ${it.name}</b>${own?"Ya es tuyo ✅":`<span class="price">💎 ${it.price}</span> <button class="btn small ${can?"gold":"ghost"}" data-buy="${it.id}" ${can?"":"disabled"} style="margin-left:6px">${can?"Comprar":"Faltan "+(it.price-S.gems)}</button>`}</div>`}).join("")+`</div></div>`;
  }else{
    const got=Object.keys(S.stickers).length;
    h+=`<div class="card"><div class="row spread"><h2>📒 Álbum de stickers</h2><span class="tag" style="font-size:18px">${got} / ${STICKERS.length}</span></div><p class="small muted" style="margin-top:0">Ganas un sticker por cada misión del día y en el cofre. A veces sale uno en la misión extra.</p><div class="album">`+
      STICKERS.map(([e,n])=>{const c=S.stickers[e]||0;return `<div class="stk ${c?"":"no"}"><span class="e">${e}</span>${c?esc(n)+(c>1?" ×"+c:""):"???"}</div>`}).join("")+`</div></div>`;
  }
  const dias=Object.keys(S.days).length;
  h+=`<div class="card"><h2>📆 Días mágicos</h2><p style="margin:0">Has entrenado <b>${dias}</b> ${dias===1?"día":"días"}.</p><div style="font-size:30px;margin-top:6px">${"🌟".repeat(Math.min(dias,30))||"Aún no hay días. ¡Empieza hoy!"}</div></div>`;
  $("#main").innerHTML=h;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{UTAB=b.dataset.t;viewUnicornio()});
  document.querySelectorAll("[data-it]").forEach(b=>b.onclick=()=>{const it=ITEMS.find(x=>x.id===b.dataset.it)||SHOP.find(x=>x.id===b.dataset.it);toggleItem(it);save();viewUnicornio()});
  document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{const it=SHOP.find(x=>x.id===b.dataset.buy);if(!it||S.owned[it.id]||S.gems<it.price)return;S.gems-=it.price;S.owned[it.id]=true;if(!isOn(it))toggleItem(it);save();renderHud();confetti();say("¡Compraste "+it.name+"!");toast("¡Nuevo: "+it.name+"!");viewUnicornio()});
  const us=$("#uniSave");if(us)us.onclick=()=>{S.uniName=$("#uniName").value.trim().slice(0,16);save();toast("¡Listo! Tu unicornio se llama "+(S.uniName||"…"));viewUnicornio()};
}
function viewPapas(){
  let h=`<h1>👨‍👩‍👧 Panel de papás</h1><p class="muted small" style="margin:0">Datos de clase actualizados: ${DATA.lastUpdate}. El progreso se guarda en este dispositivo.</p>`;
  h+=`<div class="card"><h2>Nombre</h2><label class="f">Nombre que verá en el saludo (solo se guarda en este dispositivo)<input type="text" id="nm" value="${esc(S.name)}" maxlength="20"></label><div class="row" style="margin-top:8px"><button class="btn small" id="nmSave">Guardar nombre</button></div></div>`;
  const tot=Object.values(S.prog).reduce((a,p)=>a+p.tot,0),okk=Object.values(S.prog).reduce((a,p)=>a+p.ok,0);
  h+=`<div class="card"><h2>📊 Resumen</h2><p style="margin:0">Respuestas: <b>${okk}</b> bien de <b>${tot}</b> · Días: <b>${Object.keys(S.days).length}</b> · Estrellas: <b>${S.stars}</b> · Gemas: <b>${S.gems}</b> · Stickers: <b>${Object.keys(S.stickers).length}/${STICKERS.length}</b></p></div>`;
  h+=`<div class="card"><h2>📅 Lecciones de Matemática</h2>`+DATA.events.slice().sort((a,b)=>a.date<b.date?1:-1).map(e=>{const n=daysUntil(e.date);
    return `<div class="event" style="margin:10px 0"><div class="cal"><b>${parseD(e.date).getDate()}</b>${MES[parseD(e.date).getMonth()]}</div><div><b>${esc(e.title)}</b> <span class="tag">${n<0?"pasó":n===0?"hoy":"en "+n+" días"}</span><br><span class="small">${esc(e.detail)}</span><br><span class="small muted">Juegos: ${e.skills.map(s=>GAMES[s].n).join(", ")}</span></div></div>`}).join("")+`</div>`;
  h+=`<div class="card"><h2>📚 Temas del quimestre</h2><ul style="margin:0;padding-left:22px;font-size:17px">${DATA.temas.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
  h+=`<div class="card"><h2>📈 Cómo va en cada juego</h2><table class="prog"><tr><th>Juego</th><th>Nivel</th><th>Últimas</th><th>Total</th></tr>`+Object.entries(GAMES).map(([id,g])=>{const p=S.prog[id],a=acc(id);
    return `<tr><td>${g.em} ${g.n}</td><td>${p?p.lv:1}</td><td style="${a>=0&&a<.6?"color:#e5484d;font-weight:800":""}">${a<0?"—":Math.round(a*100)+"%"}</td><td>${p?p.ok+"/"+p.tot:"—"}</td></tr>`}).join("")+`</table>
    <p class="small muted">En rojo: menos de 60% en sus últimas respuestas. La «Misión extra» practica más esos juegos. Nivel 1: números hasta 20 · Nivel 2: hasta 50 · Nivel 3: hasta 99.</p></div>`;
  h+=`<div class="card"><h2>🔊 Voz</h2><label class="f">Voz en español<select id="vSel"><option value="">Automática (${esc((bestVoice()||{}).name||"ninguna encontrada")})</option>${VOICES.map(v=>`<option ${S.voice===v.name?"selected":""}>${esc(v.name)}</option>`).join("")}</select></label>
    <label class="f" style="margin-top:8px">Velocidad: <span id="rL">${Math.round(S.rate*100)}%</span><input type="range" id="rate" min="0.6" max="1.1" step="0.05" value="${S.rate}"></label>
    <label class="row small" style="margin-top:8px"><input type="checkbox" id="auto" ${S.readAuto?"checked":""}> Leer cada pregunta en voz alta</label>
    <div class="row" style="margin-top:8px"><button class="btn small mint" id="vTest">Probar voz</button></div>
    ${VOICES.length?"":`<p class="small" style="color:#a35b00">Este dispositivo no tiene voz en español. Instala una en los ajustes de texto a voz y recarga la página.</p>`}</div>`;
  h+=`<div class="card"><h2>💾 Respaldo</h2><p class="small muted" style="margin-top:0">Para pasar el progreso a otro dispositivo: descarga el respaldo aquí y cárgalo allá.</p>
    <div class="row"><button class="btn small" id="bkDown">Descargar respaldo</button><label class="btn small ghost" for="bkUp">Cargar respaldo</label><input type="file" id="bkUp" accept=".json,application/json" hidden></div>
    <div class="row" style="margin-top:12px"><button class="btn small pink" id="reset">Borrar progreso</button><span id="resetMsg" class="small muted"></span></div></div>`;
  h+=`<div class="row" style="margin:10px 0"><button class="btn ghost" id="back">← Volver</button></div>`;
  $("#main").innerHTML=h;
  $("#nmSave").onclick=()=>{S.name=$("#nm").value.trim().slice(0,20);save();toast("Nombre guardado")};
  $("#vSel").onchange=e=>{S.voice=e.target.value;save()};
  $("#rate").oninput=e=>{S.rate=+e.target.value;$("#rL").textContent=Math.round(S.rate*100)+"%";save()};
  $("#auto").onchange=e=>{S.readAuto=e.target.checked;save()};
  $("#vTest").onclick=()=>say("¡Hola! Vamos a jugar con los números. Siete más dos es nueve. Ocho menos tres es cinco.");
  $("#bkDown").onclick=()=>{try{const blob=new Blob([JSON.stringify({app:"reino-unicornio",v:2,saved:new Date().toISOString(),state:S},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="respaldo-reino-unicornio-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast("No se pudo descargar")}};
  $("#bkUp").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=="reino-unicornio"||!d.state)throw 0;
      S=normalize(d.state);save();renderHud();toast("Respaldo cargado");viewPapas()}catch(err){toast("Ese archivo no es un respaldo válido")}};r.readAsText(f)};
  let armed=false;$("#reset").onclick=()=>{if(!armed){armed=true;$("#resetMsg").textContent="Toca otra vez para borrar todo. No se puede deshacer.";setTimeout(()=>{armed=false;const m=$("#resetMsg");if(m)m.textContent=""},5000);return}
    const nm=S.name;S=defaultState();S.name=nm;save();renderHud();toast("Progreso borrado");viewPapas()};
  $("#back").onclick=()=>setView("hoy");
}
function setView(v){VIEW=v;if(v!=="game")GAME=null;try{speechSynthesis.cancel()}catch(e){}render();window.scrollTo(0,0)}
function render(){
  renderHud();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.view===VIEW||(VIEW==="arcade"&&b.dataset.view==="magia")));
  if(VIEW==="game"&&GAME)return viewGame();
  if(VIEW==="arcade")return;
  ({hoy:viewHoy,juegos:viewJuegos,magia:viewMagia,unicornio:viewUnicornio,papas:viewPapas}[VIEW]||viewHoy)();
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
$("#hudPapas").onclick=()=>setView("papas");
window.__ru={G,GAMES,MISSIONS,SHOP,STICKERS,startGame,startArcade,startExtra,get S(){return S},get GAME(){return GAME},words,setView,unicornSVG};
render();
</script>
</body>
</html>
